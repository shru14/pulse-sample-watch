          if [ -n "$PULSE_BASE" ]; then
            git fetch -q --depth=1 origin "$PULSE_BASE"
            git worktree add -q --detach "$RUNNER_TEMP/base" FETCH_HEAD
            python3 "$RUNNER_TEMP/stack_scan.py" "$RUNNER_TEMP/base" --out "$RUNNER_TEMP/last.json"
            POLICY="$RUNNER_TEMP/base/.github/pulse-policy.json"  # the base branch's policy: a pull request can't loosen its own check
            PLAN="$RUNNER_TEMP/base/.github/compass-plan.json"  # the plan as merged: a pull request is read against the plan it would change
          else
            RECORD="$RUNNER_TEMP/record.jsonl"  # the Monday scan adds its changes to the record; a pull request does not
            if git fetch -q --depth=1 origin pulse-stack 2>/dev/null; then
              git show FETCH_HEAD:stack.json > "$RUNNER_TEMP/last.json" || true
              git show FETCH_HEAD:record.jsonl > "$RECORD" 2>/dev/null || rm -f "$RECORD"
            fi
          fi
          python3 "$RUNNER_TEMP/stack_scan.py" . --out "$RUNNER_TEMP/stack.json" --since "$RUNNER_TEMP/last.json"             --layers "$RUNNER_TEMP/layers.json" --report "$RUNNER_TEMP/change.md" --events "$RUNNER_TEMP/changes.jsonl" --policy "$POLICY" --plan "$PLAN"             ${RECORD:+--record "$RECORD"}
          if [ -f "$RUNNER_TEMP/change.md" ] && [ -n "$GITHUB_STEP_SUMMARY" ]; then
            cat "$RUNNER_TEMP/change.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the scan on the pulse-stack branch
        if: github.event_name != 'pull_request'
        run: |
          # on top of the branch as it is, so its history and any lines your team committed to record.jsonl are kept
          if git fetch -q --depth=1 origin pulse-stack 2>/dev/null; then
            git checkout -q -f --detach FETCH_HEAD
          else
            git checkout -q --orphan pulse-stack
            git rm -rq --cached .
          fi
          cp "$RUNNER_TEMP/stack.json" stack.json
          git add stack.json
          if [ -f "$RUNNER_TEMP/changes.jsonl" ]; then cp "$RUNNER_TEMP/changes.jsonl" changes.jsonl; git add changes.jsonl; fi
          if [ -f "$RUNNER_TEMP/record.jsonl" ]; then cp "$RUNNER_TEMP/record.jsonl" record.jsonl; git add record.jsonl; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Stack scan of $(date -u +%F)"
          git push -q origin HEAD:refs/heads/pulse-stack
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULSE_PR: ${{ github.event.pull_request.number }}
          PULSE_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PULSE_POST'
          import json, os, sys, urllib.request
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          url = api + "/repos/" + os.environ["PULSE_REPO"] + "/issues/" + os.environ["PULSE_PR"] + "/comments"
          head = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "pulse-stack-scan"}
          tmp = os.environ["RUNNER_TEMP"]
          try:
              body = open(os.path.join(tmp, "change.md"), encoding="utf-8").read()
              st = json.load(open(os.path.join(tmp, "stack.json"), encoding="utf-8"))
              ch = st["changes"]
          except (OSError, ValueError, KeyError):
              sys.exit(0)
          changed = bool(ch["items"] or ch["other"]["added"] or ch["other"]["removed"] or (st.get("policy") or {}).get("fail")
                         or (st.get("plan") or {}).get("new"))
          def call(method, u, data=None):
              req = urllib.request.Request(u, method=method, headers=head,
                                           data=None if data is None else json.dumps({"body": data}).encode())
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          try:
              ours = None
              for page in range(1, 6):
                  got = call("GET", url + "?per_page=100&page=" + str(page))
                  ours = next((c for c in got if "<!-- pulse-stack -->" in (c.get("body") or "")
                               and (c.get("user") or {}).get("type") == "Bot"), ours)
                  if len(got) < 100:
                      break
              if ours:
                  call("PATCH", ours["url"], body)
              elif changed:
                  call("POST", url, body)
          except Exception as e:
              print("No comment left (" + str(e) + "); the change is in this run's summary.")
          PULSE_POST
      - name: Open an issue when the Monday scan finds a change
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PULSE_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PULSE_ISSUE'
          import json, os, sys, urllib.request
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repo = api + "/repos/" + os.environ["PULSE_REPO"]
          head = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "pulse-stack-scan"}
          tmp = os.environ["RUNNER_TEMP"]
          try:
              body = open(os.path.join(tmp, "change.md"), encoding="utf-8").read()
              st = json.load(open(os.path.join(tmp, "stack.json"), encoding="utf-8"))
              ch = st["changes"]
          except (OSError, ValueError, KeyError):
              sys.exit(0)
          hard = [h for h in (st.get("policy") or {}).get("hits", []) if h["level"] == "block"]
          if not (ch["items"] or ch["other"]["added"] or ch["other"]["removed"] or hard):
              sys.exit(0)
          def call(method, u, data=None):
              req = urllib.request.Request(u, method=method, headers=head, data=None if data is None else json.dumps(data).encode())
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          try:
              open_ = call("GET", repo + "/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100")
              ours = next((i for i in open_ if "<!-- pulse-stack -->" in (i.get("body") or "") and "pull_request" not in i), None)
              if ours:
                  call("POST", ours["url"] + "/comments", {"body": body})
              else:
                  call("POST", repo + "/issues", {"title": "Pulse Pro Engine: stack change in the scan of " + st["made"], "body": body})
          except Exception as e:
              print("No issue opened (" + str(e) + "); the change is in this run's summary.")
          PULSE_ISSUE
      - name: Apply the policy file
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PULSE_GATE'
          import json, os, sys
          p = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "stack.json"), encoding="utf-8")).get("policy") or {}
          hard = [h for h in p.get("hits", []) if h["level"] == "block"]
          for h in hard:
              print(h["name"] + ": " + h["say"] + " (" + h["file"] + ")")
          if p.get("fail"):
              print("The policy file is set to block, so this check fails. Its table is in the pull request comment.")
              sys.exit(1)
          PULSE_GATE
